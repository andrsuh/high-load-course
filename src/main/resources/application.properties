server.address=0.0.0.0
server.port=8081
server.http2.enabled=true
spring.main.allow-bean-definition-overriding=true

# MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=online-shop

# Tiny event sourcing library properties
event.sourcing.auto-scan-enabled=true
event.sourcing.scan-package=ru.quipy
event.sourcing.snapshots-enabled=false
event.sourcing.sagas-enabled=false

# Postgres event store properties
spring.datasource.hikari.jdbc-url=jdbc:postgresql://${POSTGRES_ADDRESS:localhost}:${POSTGRES_PORT:65432}/postgres
spring.datasource.hikari.username=tiny_es
spring.datasource.hikari.password=tiny_es
spring.datasource.hikari.leak-detection-threshold=2000

management.metrics.web.server.request.autotime.percentiles=0.95
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=info,health,prometheus,metrics

payment.service-name=${PAYMENT_SERVICE_NAME}
payment.token=${PAYMENT_TOKEN}
payment.accounts=${PAYMENT_ACCOUNTS:acc-5}
payment.hostPort=${PAYMENT_HOST:localhost}:${PAYMENT_PORT:1234}

api.rate-limit.authentication.rate=${AUTHENTICATION_RATE_LIMIT:100}
api.rate-limit.authentication.window=${AUTHENTICATION_RATE_LIMIT_WINDOW:1s}
api.rate-limit.authentication.retry-after=${AUTHENTICATION_RETRY_AFTER:1s}
api.rate-limit.authentication-refresh.rate=${AUTHENTICATION_REFRESH_RATE_LIMIT:100}
api.rate-limit.authentication-refresh.window=${AUTHENTICATION_REFRESH_RATE_LIMIT_WINDOW:1s}
api.rate-limit.authentication-refresh.retry-after=${AUTHENTICATION_REFRESH_RETRY_AFTER:1s}
api.rate-limit.create-user.rate=${CREATE_USER_RATE_LIMIT:100}
api.rate-limit.create-user.window=${CREATE_USER_RATE_LIMIT_WINDOW:1s}
api.rate-limit.create-user.retry-after=${CREATE_USER_RETRY_AFTER:1s}
api.rate-limit.create-order.rate=${CREATE_ORDER_RATE_LIMIT:1000}
api.rate-limit.create-order.window=${CREATE_ORDER_RATE_LIMIT_WINDOW:1s}
api.rate-limit.create-order.retry-after=${CREATE_ORDER_RETRY_AFTER:1s}
api.pay-order-admission.max-queue-size=${PAY_ORDER_MAX_QUEUE_SIZE:2000}
api.pay-order-admission.safety-margin-factor=${PAY_ORDER_SAFETY_MARGIN_FACTOR:0.0}
api.pay-order-admission.processing-time-reserve-factor=${PAY_ORDER_PROCESSING_RESERVE_FACTOR:2.2}
api.pay-order-admission.retry-after=${PAY_ORDER_RETRY_AFTER:1s}
