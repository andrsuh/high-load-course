server.address=0.0.0.0
server.port=8081
server.http2.enabled=true
spring.main.allow-bean-definition-overriding=true

# MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=online-shop

# Tiny event sourcing library properties
event.sourcing.auto-scan-enabled=true
event.sourcing.scan-package=ru.quipy
event.sourcing.snapshots-enabled=false
event.sourcing.sagas-enabled=false

# Postgres event store properties
spring.datasource.hikari.jdbc-url=jdbc:postgresql://${POSTGRES_ADDRESS:localhost}:${POSTGRES_PORT:65432}/postgres
spring.datasource.hikari.username=tiny_es
spring.datasource.hikari.password=tiny_es
spring.datasource.hikari.leak-detection-threshold=2000

management.metrics.web.server.request.autotime.percentiles=0.95
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=info,health,prometheus,metrics

payment.service-name=${PAYMENT_SERVICE_NAME}
payment.token=${PAYMENT_TOKEN}
payment.accounts=${PAYMENT_ACCOUNTS:acc-23}
payment.hostPort=${PAYMENT_HOST:localhost}:${PAYMENT_PORT:1234}

# Ingress rate limiter configuration
# HW5 Test 1: 15 rps -> 11 rps, processing 2.5s
# HW5 Test 2: 11 rps, processing 13s, profile s_0.7_60 (burst pattern)
# HW5 Test 3: 3 rps, processing 26s, very long requests
ingress.rate-limiter.enabled=${INGRESS_RATE_LIMITER_ENABLED:false}
ingress.rate-limiter.type=${INGRESS_RATE_LIMITER_TYPE:sliding}
ingress.rate-limiter.rate=${INGRESS_RATE_LIMITER_RATE:11}
ingress.rate-limiter.window-seconds=${INGRESS_RATE_LIMITER_WINDOW:1}
ingress.rate-limiter.bucket-size=${INGRESS_RATE_LIMITER_BUCKET_SIZE:30}
ingress.rate-limiter.burst-capacity=${INGRESS_RATE_LIMITER_BURST:15}
ingress.retry-after-ms=${INGRESS_RETRY_AFTER_MS:500}