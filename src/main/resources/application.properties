server.address=0.0.0.0
server.port=8081
server.http2.enabled=true
# Лимиты Jetty: залп в тесте 3 приходит пачкой, поэтому поднимаем потоки и число соединений.
server.jetty.max-connections=${JETTY_MAX_CONNECTIONS:8000}
server.jetty.threads.max=${JETTY_MAX_THREADS:400}
# Keep-alive 180 с: пачки идут раз в 90 с, и при дефолтных 30 с Jetty закрывает соединения
# между пачками. Клиент вынужден открывать сотни новых TCP-соединений в момент залпа, а через
# Docker-NAT это даёт "java.net.SocketException: Connection reset" на части запросов:
server.jetty.connection-idle-timeout=${JETTY_IDLE_TIMEOUT_MS:180000}
spring.main.allow-bean-definition-overriding=true

# MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=online-shop

# Tiny event sourcing library properties
event.sourcing.auto-scan-enabled=true
event.sourcing.scan-package=ru.quipy
event.sourcing.snapshots-enabled=false
event.sourcing.sagas-enabled=false

# Postgres event store properties
spring.datasource.hikari.jdbc-url=jdbc:postgresql://${POSTGRES_ADDRESS:localhost}:${POSTGRES_PORT:65432}/postgres
spring.datasource.hikari.username=tiny_es
spring.datasource.hikari.password=tiny_es
spring.datasource.hikari.leak-detection-threshold=2000
# Пул соединений поднят с дефолтных 10: исполнитель отправки платежей работает в 48 потоков,
# и при пачке запросов потоки упирались в ожидание соединения, а не в платёжную систему.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:32}

management.metrics.web.server.request.autotime.percentiles=0.95
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=info,health,prometheus,metrics

payment.service-name=${PAYMENT_SERVICE_NAME}
payment.token=${PAYMENT_TOKEN}
payment.accounts=${PAYMENT_ACCOUNTS:acc-23}
payment.hostPort=${PAYMENT_HOST:localhost}:${PAYMENT_PORT:1234}

payment.expected-processing-time-ms=${PAYMENT_EXPECTED_PROCESSING_MS:0}

# --- Входной rate limiter ---
# leaking-bucket (GCRA): rate = допусков в секунду, bucket — запас на короткий залп.
# Два бакета, выбор автоматический по остатку дедлайна запроса (граница 5 с):
#   - короткий дедлайн (тест 1: 2.5 с, тест 2: 13 с)  -> bucket-size=11,
#     гасит только волны повторов после Retry-After;
#   - длинный дедлайн (тест 3: 26 с) -> long-bucket-size=320.
#     Отказ 429 дороже, чем задержка: клиент пересоздаёт заказ и встаёт в конец той же
#     очереди, из-за чего хвост пачки растягивается ещё сильнее. Бакет обязан вмещать
#     пачку целиком, а темп всё равно задаёт выходной лимитер на 11 rps.
# Параметры поэтому не зависят от переменных окружения — выбор делается по дедлайну.
#
# ПОЧЕМУ rate = 10, а не 11 (лимит аккаунта).
# Входной темп не должен быть равен выходному: при 11 rps на входе и 11 rps на выходе
# очередь перед лимитером аккаунта критически загружена (ρ = 1), и любой разброс превращается
# в ожидание.
# Излишек в 1 rps клиент получает как 429 и повторяет: отказ входа дешевле, чем ожидание
# в очереди, потому что 429 не расходует терпение клиента, а ожидание расходует.
# На тест 3 это не влияет: там средний вход 2.9 rps, а пачку пускает бакет 320.
ingress.rate-limiter.enabled=${INGRESS_RATE_LIMITER_ENABLED:true}
ingress.rate-limiter.type=${INGRESS_RATE_LIMITER_TYPE:leaking-bucket}
ingress.rate-limiter.rate=${INGRESS_RATE_LIMITER_RATE:10}
ingress.rate-limiter.window-seconds=${INGRESS_RATE_LIMITER_WINDOW:1}
ingress.rate-limiter.bucket-size=${INGRESS_RATE_LIMITER_BUCKET_SIZE:11}
ingress.rate-limiter.long-bucket-size=${INGRESS_RATE_LIMITER_LONG_BUCKET_SIZE:320}
ingress.rate-limiter.burst-capacity=${INGRESS_RATE_LIMITER_BURST:11}
# Сколько максимум ждать слот входного лимитера, прежде чем ответить 429.
ingress.wait-ms=${INGRESS_WAIT_MS:300}
# Пауза перед повтором для отказов 429. Отдаётся в секундах: 1000 мс -> "1", 0 -> "0".
ingress.retry-after-ms=${INGRESS_RETRY_AFTER_MS:1000}